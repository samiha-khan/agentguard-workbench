services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: agentguard
      MYSQL_USER: agentguard
      MYSQL_PASSWORD: agentguard
      MYSQL_ROOT_PASSWORD: local-root-only
    ports: ["3306:3306"]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 5s, timeout: 5s, retries: 20}
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/agentguard
      DATABASE_USER: agentguard
      DATABASE_PASSWORD: agentguard
    ports: ["8080:8080"]
    depends_on:
      mysql: {condition: service_healthy}

